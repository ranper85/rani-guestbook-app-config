apiVersion: apps/v1
kind: Deployment
metadata:
  name: rani-guestbook-backend-deployment
  namespace: grupp1
  labels:
    app: rani-guestbook-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rani-guestbook-backend
  template:
    metadata:
      labels:
        app: rani-guestbook-backend
    spec:
      containers:
        - name: rani-guestbook-backend
          image: 
          ports:
            - containerPort: 8080

          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          envFrom:
            - configMapRef:
                name: rani-guestbook-backend-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: rani-guestbook-postgres-secret
                  key: POSTGRESQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rani-guestbook-postgres-secret
                  key: POSTGRESQL_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: rani-guestbook-postgres-secret
                  key: POSTGRESQL_DATABASE
            - name: PORT
              value: "8080"
            - name: REDIS_HOST
              value: "rani-guestbook-redis-service"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rani-guestbook-redis-secret
                  key: REDIS_PASSWORD
 
